name: Idea or request
description: A new pattern, slicer support, or anything else you'd like it to do
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Sketches or photos of the effect you're after are great.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What would you print with it?
